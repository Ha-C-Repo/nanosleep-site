<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NanoSleep Site Cluster 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;background:radial-gradient(120% 80% at 78% 12%,#0a1b2e 0%,#050d1a 55%,#02060d 100%);font-family:'Courier New',monospace;}
#c{display:block;width:100%;height:100%;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}#c:active{cursor:grabbing}
.tag{position:fixed;top:12px;left:14px;font-size:9px;letter-spacing:.22em;color:rgba(34,184,214,.7);text-transform:uppercase;z-index:2;pointer-events:none}
.hint{position:fixed;bottom:12px;right:14px;font-size:9px;letter-spacing:.18em;color:rgba(240,242,245,.35);text-transform:uppercase;z-index:2;pointer-events:none}
.fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:rgba(240,242,245,.5);font-size:12px;letter-spacing:.1em;text-align:center;padding:24px}
.nowebgl #c{display:none}.nowebgl .fallback{display:flex}
</style></head><body>
<div class="tag">NS-VIZ-SITE-001 · Phase 1 · I-10 Cluster · Illustrative</div>
<div class="hint">Drag to orbit</div>
<canvas id="c" aria-label="Interactive 3D night view of the Phase 1 ten-pod highway cluster"></canvas>
<div class="fallback">3D view needs WebGL. Phase 1: 10 Twin Pods on the I-10 corridor, off-grid, zero staff.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  if(!window.THREE){ document.body.classList.add('nowebgl'); return; }
  var T=window.THREE, canvas=document.getElementById('c');
  var renderer; try{ renderer=new T.WebGLRenderer({canvas:canvas,alpha:true,antialias:true,powerPreference:'high-performance'}); }
  catch(e){ document.body.classList.add('nowebgl'); return; }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=T.PCFSoftShadowMap; renderer.outputEncoding=T.sRGBEncoding;
  var scene=new T.Scene(); scene.fog=new T.Fog(0x050d1a,46,150);
  var root=new T.Group(); scene.add(root);

  function mat(c,m,r,e,ei){ var o={color:c,metalness:m,roughness:r}; if(e!=null){o.emissive=e;o.emissiveIntensity=ei||1;} return new T.MeshStandardMaterial(o); }
  var M={ body:mat(0x28333f,0.45,0.5), trim:mat(0x9fa6ad,0.3,0.55), tube:mat(0x6b8a9a,0.85,0.32), solar:mat(0x081626,0.92,0.18,0x06243a,0.22),
    door:mat(0x161f2a,0.5,0.6), warm:mat(0x3a2a12,0.3,0.5,0xF5A623,1.7), cool:mat(0x103040,0.3,0.5,0x22B8D6,1.2),
    ground:mat(0x0e1822,0.1,0.92), road:mat(0x0c121a,0.1,0.9), lane:mat(0x3a2c10,0.2,0.6,0xF5A623,0.5), pier:mat(0xa9adb2,0.25,0.6), pad:mat(0x1a2733,0.2,0.85) };
  function box(p,material,w,h,d,x,y,z){ var m=new T.Mesh(new T.BoxGeometry(w,h,d),material); m.position.set(x||0,y||0,z||0); m.castShadow=true; m.receiveShadow=true; p.add(m); return m; }

  // compact pod builder (W2 x L3 x H2.4), lit = warm(occupied)/cool(vacant)
  function pod(px,pz,lit,delay){ var grp=new T.Group(); var W=2.6,L=3.9,H=3.0,t=0.12;
    box(grp,M.trim,W+0.18,0.2,L+0.18,0,0.12,0);                 // base skirt
    box(grp,M.body,W-0.08,H-0.5,L-0.08,0,H/2+0.05,0);           // navy clad body
    [[-W/2,-L/2],[W/2,-L/2],[-W/2,L/2],[W/2,L/2]].forEach(function(c){ box(grp,M.trim,t,H-0.35,t,c[0],H/2+0.05,c[1]); }); // corner trims
    box(grp,M.trim,W+0.18,0.16,L+0.18,0,H-0.02,0);              // coping cap
    var s=box(grp,M.solar,W-0.3,0.05,L-0.7,0,H+0.18,0.1); s.rotation.x=-0.22; // tilted solar
    box(grp,M.door,0.72,1.7,0.06,-0.5,0.95,L/2+0.02);           // door
    box(grp, lit?M.warm:M.cool, 0.06,1.1,0.42, W/2+0.02,1.6,-0.4); // glowing window (vertical)
    [[-W/2+0.3,-L/2+0.3],[W/2-0.3,-L/2+0.3],[-W/2+0.3,L/2-0.3],[W/2-0.3,L/2-0.3]].forEach(function(c){
      var p=new T.Mesh(new T.CylinderGeometry(0.13,0.13,0.5,12),M.pier); p.position.set(c[0],-0.2,c[1]); p.castShadow=true; grp.add(p); });
    var pad=new T.Mesh(new T.BoxGeometry(W+0.7,0.12,L+0.7),M.pad); pad.position.y=-0.06; pad.receiveShadow=true; grp.add(pad);
    grp.position.set(px,0,pz); grp.userData={delay:delay}; root.add(grp); return grp;
  }

  // ground + road + dashed lane
  var ground=new T.Mesh(new T.PlaneGeometry(200,200),M.ground); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
  var grid=new T.GridHelper(80,32,0x214152,0x14242e); grid.material.opacity=0.25; grid.material.transparent=true; grid.position.y=0.01; scene.add(grid);
  var road=box(scene,M.road,150,0.04,8,0,0.02,9); road.castShadow=false;
  for(var lx=-72;lx<=72;lx+=6){ var d=box(scene,M.lane,2.6,0.05,0.4,lx,0.06,9); d.castShadow=false; }

  // pods: 2 rows of 5
  var pods=[], gap=3.5, sx=-2*gap;
  for(var r=0;r<2;r++) for(var c=0;c<5;c++){ var lit=((c+r)%3!==0); pods.push(pod(sx+c*gap, r*4.0-2.0, lit, (r*5+c)*0.07)); }
  window.__podCount=pods.length;

  // moon + glow + stars
  var moon=new T.Mesh(new T.SphereGeometry(4,32,32), new T.MeshBasicMaterial({color:0xeaf2f7})); moon.position.set(34,22,-46); scene.add(moon);
  var glow=new T.Mesh(new T.SphereGeometry(7,32,32), new T.MeshBasicMaterial({color:0x22B8D6,transparent:true,opacity:0.12})); glow.position.copy(moon.position); scene.add(glow);
  var sg=new T.BufferGeometry(), sv=[]; for(var i=0;i<700;i++){ var rr=120+Math.random()*60,a=Math.random()*Math.PI*2,b=Math.random()*Math.PI*0.5; sv.push(Math.cos(a)*Math.sin(b+0.1)*rr, Math.cos(b)*rr+20, Math.sin(a)*Math.sin(b+0.1)*rr-30); }
  sg.setAttribute('position',new T.Float32BufferAttribute(sv,3));
  scene.add(new T.Points(sg,new T.PointsMaterial({color:0xffffff,size:0.5,transparent:true,opacity:0.7})));

  // lights
  scene.add(new T.HemisphereLight(0x3a5e74,0x0a1018,0.85));
  scene.add(new T.AmbientLight(0x33485e,0.42));
  var key=new T.DirectionalLight(0xfff0d8,1.2); key.position.set(26,34,18); key.castShadow=true;
  key.shadow.mapSize.set(2048,2048); var sc=key.shadow.camera; sc.near=1; sc.far=160; sc.left=-30; sc.right=30; sc.top=30; sc.bottom=-30; sc.updateProjectionMatrix(); scene.add(key);
  var rim=new T.DirectionalLight(0x22B8D6,0.7); rim.position.set(-28,12,-22); scene.add(rim);

  // camera + orbit
  var camera=new T.PerspectiveCamera(40,1,0.1,400);
  var target=new T.Vector3(0,0.4,0), R=27, theta=0.9, phi=0.74, idle=0, dragging=false,lx=0,ly=0;
  function place(){ camera.position.set(target.x+R*Math.sin(phi)*Math.cos(theta), target.y+R*Math.cos(phi), target.z+R*Math.sin(phi)*Math.sin(theta)); camera.lookAt(target); }
  function size(){ var w=canvas.clientWidth,h=canvas.clientHeight||1; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
  canvas.addEventListener('pointerdown',function(e){ e.preventDefault(); dragging=true; lx=e.clientX; ly=e.clientY; idle=0; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove',function(e){ if(!dragging)return; e.preventDefault(); theta-=(e.clientX-lx)*0.005; phi=Math.max(0.35,Math.min(1.3,phi-(e.clientY-ly)*0.005)); lx=e.clientX; ly=e.clientY; idle=0; });
  function up(){ dragging=false; } canvas.addEventListener('pointerup',up); canvas.addEventListener('pointerleave',up);
  canvas.addEventListener('wheel',function(e){ e.preventDefault(); R=Math.max(20,Math.min(52,R+e.deltaY*0.02)); },{passive:false});

  var tStart=null,tPrev=null;
  function loop(ts){ if(tStart==null){tStart=ts;tPrev=ts;} var dt=Math.min(0.05,(ts-tPrev)/1000); tPrev=ts; var el=(ts-tStart)/1000;
    if(!dragging){ idle+=dt; if(idle>0.6) theta+=dt*0.045; }
    place(); renderer.render(scene,camera); requestAnimationFrame(loop);
  }
  canvas.addEventListener('webglcontextlost',function(e){ e.preventDefault(); document.body.classList.add('nowebgl'); },false);
  size(); place(); window.addEventListener('resize',size); requestAnimationFrame(loop);
})();
</script></body></html>
