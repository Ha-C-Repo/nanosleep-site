<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>NanoSleep Site Cluster Render</title>
<style>
html,body{margin:0;height:100%;background:#03070f;overflow:hidden;font-family:'Courier New',monospace}
#c{display:block;width:100%;height:100%}
.tag{position:fixed;top:12px;left:14px;font-size:9px;letter-spacing:.2em;color:rgba(255,255,255,.4);text-transform:uppercase;z-index:2;pointer-events:none}
</style></head><body>
<div class="tag">NS-VIZ-SITE-001 · Phase 1 Cluster · Illustrative</div>
<canvas id="c" aria-label="Illustrative night view of the ten-pod highway cluster"></canvas>
<script>
(function(){
var cc=document.getElementById('c'),g=cc.getContext('2d'),cw,ch;
function size(){cw=cc.width=cc.offsetWidth;ch=cc.height=cc.offsetHeight;}
function pod(x,y,s,lit){var w=s,h=s*0.62,d=s*0.42;
 g.beginPath();g.moveTo(x,y);g.lineTo(x+w,y);g.lineTo(x+w-d,y-d*0.7);g.lineTo(x-d,y-d*0.7);g.closePath();g.fillStyle='#0c1a2e';g.fill();g.strokeStyle='rgba(34,184,214,0.55)';g.lineWidth=1;g.stroke();
 g.beginPath();g.moveTo(x,y);g.lineTo(x,y+h);g.lineTo(x+w,y+h);g.lineTo(x+w,y);g.closePath();g.fillStyle='#081320';g.fill();g.strokeStyle='rgba(34,184,214,0.45)';g.stroke();
 g.beginPath();g.moveTo(x+w,y);g.lineTo(x+w-d,y-d*0.7);g.lineTo(x+w-d,y+h-d*0.7);g.lineTo(x+w,y+h);g.closePath();g.fillStyle='#060f19';g.fill();g.strokeStyle='rgba(34,184,214,0.3)';g.stroke();
 if(lit){g.fillStyle='rgba(245,166,35,0.9)';g.fillRect(x+w*0.30,y+h*0.32,w*0.18,h*0.30);g.fillStyle='rgba(245,166,35,0.18)';g.fillRect(x+w*0.30-3,y+h*0.32-3,w*0.18+6,h*0.30+6);}
 else{g.fillStyle='rgba(34,184,214,0.5)';g.fillRect(x+w*0.30,y+h*0.32,w*0.18,h*0.30);}}
function scene(){if(!cw)size();
 var grd=g.createLinearGradient(0,0,0,ch);grd.addColorStop(0,'#03070f');grd.addColorStop(0.6,'#050d1a');grd.addColorStop(1,'#081424');g.fillStyle=grd;g.fillRect(0,0,cw,ch);
 for(var i=0;i<110;i++){var sx=(i*977)%cw,sy=(i*613)%(ch*0.55);g.fillStyle='rgba(255,255,255,'+(0.05+((i*37)%30)/200)+')';g.fillRect(sx,sy,1,1);}
 var mg=g.createRadialGradient(cw*0.82,ch*0.18,0,cw*0.82,ch*0.18,140);mg.addColorStop(0,'rgba(34,184,214,0.18)');mg.addColorStop(1,'rgba(34,184,214,0)');g.fillStyle=mg;g.fillRect(cw*0.82-140,ch*0.18-140,280,280);
 g.fillStyle='rgba(240,242,245,0.85)';g.beginPath();g.arc(cw*0.82,ch*0.18,22,0,6.283);g.fill();g.fillStyle='#050d1a';g.beginPath();g.arc(cw*0.82+8,ch*0.18-6,20,0,6.283);g.fill();
 g.fillStyle='#06101c';g.fillRect(0,ch*0.66,cw,ch*0.34);g.strokeStyle='rgba(34,184,214,0.25)';g.lineWidth=1;g.beginPath();g.moveTo(0,ch*0.66);g.lineTo(cw,ch*0.66);g.stroke();
 g.strokeStyle='rgba(245,166,35,0.5)';g.setLineDash([16,18]);g.lineWidth=2;g.beginPath();g.moveTo(0,ch*0.92);g.lineTo(cw,ch*0.92);g.stroke();g.setLineDash([]);
 var s=Math.max(34,cw/16),baseY=ch*0.62,gap=s*1.5,startX=cw/2-gap*2.0;
 for(var r=0;r<2;r++){for(var c=0;c<5;c++){var lit=((c+r)%3!==0);pod(startX+c*gap+r*8,baseY-r*22,s,lit);}}}
size();scene();window.addEventListener('resize',function(){size();scene();});
})();
</script></body></html>
